<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Catálogo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="catalog-intro">
    <h1>Catálogo</h1>
    <p>Busca estos productos y añádelos en tu nuevo pedido.</p>
  </section>
  <ion-list inset="true">
    <ion-item
      ><ion-label
        ><h2>Frutas y verduras</h2>
        <p>Frescas, locales y de temporada.</p></ion-label
      ></ion-item
    >
    <ion-item
      ><ion-label
        ><h2>Granos y abarrotes</h2>
        <p>Todo lo esencial para tu despensa.</p></ion-label
      ></ion-item
    >
    <ion-item
      ><ion-label
        ><h2>Bebidas y lácteos</h2>
        <p>Opciones para cada día.</p></ion-label
      ></ion-item
    >
  </ion-list>
</ion-content>
