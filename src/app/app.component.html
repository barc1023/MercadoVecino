<ion-app>

  <ion-menu content-id="main-content">

    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>MercadoVecino</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>

      <ion-list>

        <ion-menu-toggle auto-hide="false">

          <ion-item routerLink="/home">
            <ion-label>Inicio</ion-label>
          </ion-item>

          <ion-item routerLink="/catalog">
            <ion-label>Catálogo</ion-label>
          </ion-item>

          <ion-item *ngIf="role === 'cliente'" routerLink="/orders">

            <ion-label>Mis Pedidos</ion-label>

          </ion-item>

          <ion-item *ngIf="role === 'comerciante'" routerLink="/products">

            <ion-label>Gestionar Productos</ion-label>

          </ion-item>

          <ion-item *ngIf="role === 'admin'" routerLink="/admin">
            
            <ion-label>Panel Admin</ion-label>
         
          </ion-item>

        </ion-menu-toggle>

      </ion-list>

    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
