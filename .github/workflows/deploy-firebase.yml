name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # No deployment is attempted until the repository has the required secrets.
    if: ${{ vars.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_TOKEN != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate production Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          sed -e "s|TU_API_KEY|$FIREBASE_API_KEY|g" \
              -e "s|TU_PROYECTO.firebaseapp.com|$FIREBASE_AUTH_DOMAIN|g" \
              -e "s|TU_PROYECTO|$FIREBASE_PROJECT_ID|g" \
              -e "s|TU_PROYECTO.firebasestorage.app|$FIREBASE_STORAGE_BUCKET|g" \
              -e "s|000000000000|$FIREBASE_MESSAGING_SENDER_ID|g" \
              -e "s|1:000000000000:web:0000000000000000000000|$FIREBASE_APP_ID|g" \
              src/environments/environment.prod.example.ts > src/environments/environment.prod.ts
          cp src/environments/environment.example.ts src/environments/environment.ts
      - run: pnpm build
      - name: Deploy hosting, rules and indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: pnpm dlx firebase-tools deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
